name: Graphify

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graphify
        run: pip install --upgrade 'graphifyy[gemini]'

      - name: Run graphify extraction (headless CI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: graphify extract . --backend gemini --max-concurrency 1

      - name: Export interactive HTML
        run: graphify export html || true

      - name: Open PR with graph updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -z "$(git status --porcelain graphify-out)" ]; then
            echo "No graph changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B graphify/update
          git add graphify-out
          git commit -m "chore: update graphify knowledge graph"
          git push -f origin graphify/update
          if ! gh pr list --head graphify/update --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --title "chore: update graphify knowledge graph" \
                          --body "Automated graphify knowledge-graph update." \
                          --base develop --head graphify/update
          fi
