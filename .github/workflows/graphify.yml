name: Graphify

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graphify
        run: pip install --upgrade 'graphifyy[gemini]'

      - name: Run graphify extraction (headless CI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: graphify extract . --backend gemini

      - name: Export interactive HTML
        run: graphify export html || true

      - name: Open PR with graph updates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update graphify knowledge graph"
          title: "chore: update graphify knowledge graph"
          body: Automated graphify knowledge-graph update.
          branch: graphify/update
          base: develop
          delete-branch: true
          add-paths: graphify-out
