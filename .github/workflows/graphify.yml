name: Graphify

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graphify
        run: pip install --upgrade 'graphifyy[gemini]'

      - name: Run graphify extraction (headless CI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: graphify extract . --backend gemini

      - name: Export interactive HTML
        run: graphify export html || true

      - name: Commit graph outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out
          git diff --staged --quiet || git commit -m "chore: update graphify knowledge graph [skip ci]"
          git push
