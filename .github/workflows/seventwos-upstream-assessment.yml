name: Seventwos upstream assessment

# SCAFFOLD — read-only / report-only. Accepts immutable upstream-assessment
# artifacts added under .seventwos/assessments/ and archives them as a
# workflow artifact for later human/agent review. It does NOT evaluate
# upstream commits, compute merges, apply changes, or open any sync PR.
# See .seventwos/policy.yml (PRINCIPLE-REPORT-ONLY-FOR-NOW).
#
# Minimal permissions, SHA-pinned actions, persist-credentials: false.

on:
  pull_request:
    paths:
      - ".seventwos/assessments/**"
  workflow_dispatch:
    inputs:
      artifact_path:
        description: >
          Path (relative to repo root) to an existing, already-committed
          assessment artifact under .seventwos/assessments/ to archive.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ format('seventwos-upstream-assessment-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  intake:
    name: intake-assessment-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed/target assessment files
        id: files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            path="${{ inputs.artifact_path }}"
            case "$path" in
              .seventwos/assessments/*) ;;
              *) echo "error: artifact_path must be under .seventwos/assessments/" >&2; exit 1 ;;
            esac
            if [ ! -f "$path" ]; then
              echo "error: $path does not exist" >&2
              exit 1
            fi
            printf '%s\n' "$path" > changed_files.txt
          else
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git diff --name-only --diff-filter=AM "$base" "$head" -- '.seventwos/assessments/**' > changed_files.txt || true
          fi
          echo "count=$(wc -l < changed_files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat changed_files.txt

      - name: Reject modification of existing assessment artifacts
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          modified=$(git diff --name-only --diff-filter=M "$base" "$head" -- '.seventwos/assessments/**' || true)
          if [ -n "$modified" ]; then
            echo "::error::Assessment artifacts are immutable. These existing files were modified instead of adding a new file:"
            echo "$modified"
            exit 1
          fi
          removed=$(git diff --name-only --diff-filter=D "$base" "$head" -- '.seventwos/assessments/**' || true)
          if [ -n "$removed" ]; then
            echo "::error::Assessment artifacts are immutable. These existing files were deleted:"
            echo "$removed"
            exit 1
          fi

      - name: Stage artifacts for archival
        if: steps.files.outputs.count != '0'
        run: |
          set -euo pipefail
          mkdir -p /tmp/seventwos-assessment-intake
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "/tmp/seventwos-assessment-intake/$(dirname "$f")"
            cp "$f" "/tmp/seventwos-assessment-intake/$f"
          done < changed_files.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.files.outputs.count != '0'
        with:
          name: seventwos-upstream-assessment-intake
          path: /tmp/seventwos-assessment-intake
          retention-days: 90

      - name: Report-only summary
        run: |
          {
            echo "## Seventwos upstream-assessment intake (report-only)"
            echo
            echo "This workflow only archives the artifact(s) below for review."
            echo "No upstream evaluation, merge, or sync action was taken."
            echo
            if [ -s changed_files.txt ]; then
              echo "### Artifacts"
              sed 's/^/- /' changed_files.txt
            else
              echo "_No new assessment artifacts detected in this run._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
